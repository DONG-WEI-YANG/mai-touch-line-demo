name: Verify system integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test with coverage thresholds
        run: npm run test:coverage
      - name: Build web
        run: npm run web:build
      - name: Verify isolated system flows
        run: npm run smoke:system

name: keep-gateway-warm

# Production LINE traffic goes Firebase Hosting → Cloud Run `mai-touch-gateway`
# (min instances 0) → Direct VPC → GCP VM. After the gateway scales to zero, a
# fresh instance passes its own startup probe in seconds, but the Direct VPC
# path to the VM takes ~2–3 minutes to come up. During that window every
# webhook hangs until the gateway's 45s upstream timeout and returns 502, so
# residents see no reply, tap again, then receive a burst of replies at once.
#
# The fix lives on Cloud Run (2026-09-11): min instances 1 plus a startup probe
# on /_gateway/ready, so a new instance takes traffic only once the VM is
# reachable. This workflow is a best-effort external monitor on top of that;
# GitHub-hosted schedules can be delayed or skipped under load.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping gateway /health (with cold-start retries)
        run: |
          URL="https://mai-touch-history-20260908.web.app/health"
          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          # A cold gateway can 502 for ~3 min (each attempt up to 45s), so retry past that window.
          for i in 1 2 3 4 5 6 7 8; do
            : > "$body_file"
            if code=$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 50 "$URL"); then
              :
            else
              code=000
            fi
            echo "attempt $i -> HTTP $code"
            if [ -s "$body_file" ]; then cat "$body_file"; echo; fi
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::/health did not return 200 after retries"
          exit 1
